<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="stripGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Subtle Biotech Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(80, 70)">
    <rect width="320" height="36" rx="18" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">IVD SCIENTIFIC WHITEPAPER</text>
  </g>

  <!-- Header Title -->
  <text x="80" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Reducing Batch-to-Batch Variation
  </text>
  <text x="80" y="215" fill="url(#blueGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
    in Lateral Flow Assays
  </text>

  <!-- Subtitle -->
  <text x="80" y="260" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
    The Critical Role of Recombinant Antigen Purity, Conformation &amp; Lot Qualification
  </text>

  <!-- Lateral Flow Strip Diagram Card -->
  <g transform="translate(80, 310)">
    <rect width="1040" height="230" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Diagram Title Bar -->
    <text x="30" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      MOLECULAR ARCHITECTURE OF A LATERAL FLOW IMMUNOASSAY (LFIA)
    </text>
    <text x="850" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">
      ISO 13485 / CLSI EP25
    </text>

    <!-- The Test Strip Assembly -->
    <g transform="translate(30, 65)">
      <!-- Backing Card -->
      <rect x="0" y="20" width="980" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />

      <!-- Sample Pad -->
      <rect x="10" y="25" width="160" height="60" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="90" y="60" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sample Pad</text>
      <text x="90" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Whole Blood / Serum</text>

      <!-- Conjugate Pad (Gold nanoparticles) -->
      <rect x="160" y="27" width="160" height="56" rx="4" fill="#fef08a" stroke="#facc15" stroke-width="1" />
      <circle cx="195" cy="55" r="4" fill="#dc2626" />
      <circle cx="210" cy="50" r="4" fill="#dc2626" />
      <circle cx="225" cy="60" r="4" fill="#dc2626" />
      <circle cx="240" cy="52" r="4" fill="#dc2626" />
      <text x="240" y="42" fill="#854d0e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Conjugate Pad</text>
      <text x="240" y="74" fill="#a16207" font-family="system-ui, sans-serif" font-size="10">AuNP-Ab Complex</text>

      <!-- Nitrocellulose Membrane -->
      <rect x="310" y="25" width="460" height="60" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Flow Direction Arrow -->
      <path d="M 330 35 L 360 35 M 355 30 L 360 35 L 355 40" stroke="#3b82f6" stroke-width="2" fill="none" />
      <text x="370" y="39" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Capillary Flow</text>

      <!-- Test Line (T-Line: Recombinant Capture Antigen) -->
      <rect x="470" y="25" width="8" height="60" fill="#ef4444" />
      <text x="474" y="105" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Test Line (T)</text>
      <text x="474" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Recombinant Antigen</text>

      <!-- Control Line (C-Line) -->
      <rect x="610" y="25" width="8" height="60" fill="#3b82f6" />
      <text x="614" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Control Line (C)</text>
      <text x="614" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Secondary Antibody</text>

      <!-- Absorbent Wick Pad -->
      <rect x="760" y="25" width="210" height="60" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <text x="865" y="60" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Absorbent Wick Pad</text>
      <text x="865" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sink / Waste Capillary</text>
    </g>

    <!-- Bottom Metric Pills -->
    <g transform="translate(30, 185)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="105" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">&ge;95% SEC-HPLC Purity</text>

      <rect x="225" width="220" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="335" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Azide / Carrier-Free</text>

      <rect x="460" width="240" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="580" y="18" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Lot-to-Lot CV &lt; 5% Target</text>

      <rect x="715" width="265" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="847" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Bangalore Biomanufacturing</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      SMD Life Sciences &bull; Diagnostic CDMO &amp; IVD Raw Materials &bull; Bangalore, India
    </text>
    <text x="1040" y="0" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">
      lifesciences.smdmedicare.in
    </text>
  </g>
</svg>
